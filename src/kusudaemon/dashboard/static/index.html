<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Kusudaemon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4.5' fill='%23d9b45a'/%3E%3C/svg%3E" />
  <script>
    try {
      var t = localStorage.getItem("kd.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" crossorigin src="/static/app.js"></script>
  <link rel="stylesheet" crossorigin href="/static/app.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
