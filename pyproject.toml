[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kusudaemon"
version = "1.1.0"
description = "Recursive-decomposition harness for long-horizon tasks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "long-horizon", "computer-use", "llm"]
dependencies = [
    "packaging",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
gptme = ["gptme"]
dev = ["tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/OrigamiKoala/LongHorizon-Harness"
Issues = "https://github.com/OrigamiKoala/LongHorizon-Harness/issues"

[project.scripts]
kusudaemon = "kusudaemon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kusudaemon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/kusudaemon",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]
